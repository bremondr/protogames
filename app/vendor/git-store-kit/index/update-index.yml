# git-store-kit: keeps git-store-index.json up to date in a data repo, so apps read the repo without a token and with
# no GitHub API requests. The original is git-store-kit/index/update-index.yml in bremondr/web-kit; a data repo keeps
# a copy at .github/workflows/update-index.yml, next to .github/build-index.mjs from the same folder.
#
# It runs on every push to the default branch (an app's "Publish" makes one too) and when started by hand. It commits
# the index only when the listed files changed. A commit made with GITHUB_TOKEN doesn't start another run, so it
# doesn't loop. To index only some folders, name them after the script: node .github/build-index.mjs drills plans
name: Update the index

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# one run at a time, each on the newest commit, so two quick pushes don't race
concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  index:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Build and commit the index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${{ github.event.repository.default_branch }}"
          for attempt in 1 2 3; do
            git fetch --quiet origin "$branch"
            git reset --quiet --hard "origin/$branch"
            node .github/build-index.mjs
            if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard -- git-store-index.json)" ]; then
              echo "Nothing to commit."
              exit 0
            fi
            git add git-store-index.json
            git commit --quiet -m "Update git-store-index.json"
            if git push --quiet origin "HEAD:$branch"; then exit 0; fi
            echo "Someone pushed meanwhile; trying again."
            sleep $((attempt * 5))
          done
          echo "Couldn't push the index after 3 tries."
          exit 1
